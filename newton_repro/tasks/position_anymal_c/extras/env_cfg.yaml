viewer:
  eye: !!python/tuple
  - 1.0
  - 1.75
  - 1.75
  lookat: !!python/tuple
  - 0.0
  - 0.0
  - 0.0
  cam_prim_path: /OmniverseKit_Persp
  resolution: !!python/tuple
  - 1280
  - 720
  origin_type: asset_body
  env_index: 0
  asset_name: robot
  body_name: base
sim:
  device: cuda:0
  dt: 0.005
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
  physics_prim_path: /physicsScene
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 1.0
    dynamic_friction: 1.0
    restitution: 0.0
    compliant_contact_stiffness: null
    compliant_contact_damping: null
    friction_combine_mode: multiply
    restitution_combine_mode: multiply
    _usd_applied_schema: PhysxMaterialAPI
    _usd_field_exceptions: {}
    _usd_namespace: physxMaterial
  use_fabric: true
  render_interval: 8
  enable_scene_query_support: false
  physics:
    class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
    num_substeps: 1
    debug_mode: false
    use_cuda_graph: true
    solver_cfg:
      class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
      solver_type: mujoco_warp
      njmax: 250
      nconmax: 100
      iterations: 100
      ls_iterations: 50
      solver: newton
      integrator: implicitfast
      use_mujoco_cpu: false
      disable_contacts: false
      default_actuator_gear: null
      actuator_gears: null
      update_data_interval: 1
      save_to_mjcf: null
      impratio: 1.0
      cone: pyramidal
      ccd_iterations: 35
      ls_parallel: false
      use_mujoco_contacts: false
      tolerance: 1.0e-06
    collision_cfg:
      broad_phase: explicit
      reduce_contacts: true
      rigid_contact_max: null
      max_triangle_pairs: 2500000
      soft_contact_max: null
      soft_contact_margin: 0.01
      requires_grad: null
      sdf_hydroelastic_config: null
    default_shape_cfg:
      margin: 0.02
      gap: 0.01
  render:
    enable_translucency: null
    enable_reflections: null
    enable_global_illumination: null
    antialiasing_mode: null
    enable_dlssg: null
    enable_dl_denoiser: null
    dlss_mode: null
    enable_direct_lighting: null
    samples_per_pixel: null
    enable_shadows: null
    enable_ambient_occlusion: null
    dome_light_upper_lower_strategy: null
    max_bounces: null
    split_glass: null
    split_clearcoat: null
    split_rough_reflection: null
    ambient_light_intensity: null
    ambient_occlusion_denoiser_mode: null
    view_tile_limit: null
    carb_settings: null
    rendering_mode: null
  create_stage_in_memory: false
  logging_level: WARNING
  save_logs_to_file: true
  log_dir: null
  visualizer_cfgs: []
ui_window_class_type: isaaclab.envs.ui.manager_based_rl_env_window:ManagerBasedRLEnvWindow
seed: 42
decimation: 8
